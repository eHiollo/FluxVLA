# Copy to site.local.yaml and replace the addresses and camera placeholders.
robot:
  host: 127.0.0.1  # Controller host; native VR uses the WS/UDP ports below.
  port: 8080
  allow_motion: false
  max_joint_step_rad: null  # Confirm the permitted joint step onsite.
  gripper_mm_range: null   # Confirm the physical range in mm onsite.
cameras:
  base_0_rgb:
    device: /dev/v4l/by-id/REPLACE_WITH_BASE_CAMERA
    rotate_180: false
  right_wrist_0_rgb:
    device: /dev/v4l/by-id/REPLACE_WITH_WRIST_CAMERA
    rotate_180: true
vr_operator:
  # Used by teleop; configure confirmed feedback units and per-frame limits.
  feedback_position_unit: null  # mm or m; TCP feedback unit, not UDP target unit.
  max_position_step_m: null
  max_rotation_step_rad: null
  max_position_tracking_error_m: 0.05
  max_rotation_tracking_error_rad: 0.35
  ws_port: 5999
  udp_port: 9998
  joint_udp_port: 9999
  # Optional USB gripper, e.g. /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
  gripper_port: null
  gripper_speed_mm_s: 30.0
vr_server:
  host_ip: 127.0.0.1  # For the headset, use this FluxVLA machine's specific LAN IP.
  https_port: 8443
  websocket_port: 8442
model:
  trained_checkpoint: null  # Do not use the two-step smoke model for robot control.
  statistics_path: null
