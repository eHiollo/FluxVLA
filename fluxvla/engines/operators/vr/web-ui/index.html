<!DOCTYPE html>
<!-- Adapted from XLeVR; see ../NOTICE.md and ../LICENSE.xlevr. -->
<html lang="zh-CN"><head><meta charset="utf-8">
<title>FluxVLA · A10 VR</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<script src="vr-config.js"></script><script src="latency.js" defer></script><script src="vr_app.js" defer></script>
<link rel="stylesheet" href="styles.css"></head><body>
<div id="modeNotice" style="position:fixed;z-index:10;padding:12px;background:#ffffffdd;border-radius:8px">
<strong>FluxVLA · A10 VR</strong><br>进入 VR 后使用右手侧键控制机械臂、摇杆控制夹爪。<br>
双臂采集：按住右手A，再拨左摇杆：右=开始/保存，左=重录，下=停止采集，上=复位。<br>进入/退出功能键模式须左摇杆回中；未启用采集时摇杆只控制夹爪。<br>
相机、机器人地址和运动参数在平台配置中设置。
</div>
    <a-scene vr-mode-ui="enabled: true;">
      <!-- Passthrough setup -->
      <a-entity webxr-passthrough="referenceSpaceType: local-floor"></a-entity>

      <!-- Headset tracking entity -->
      <a-entity id="headset" camera>
        <a-entity id="recordHudRoot" position="0 0.18 -0.72" scale="0.065 0.065 0.065">
          <a-plane width="8.6" height="6.3" position="0 0 -0.04" material="shader: flat; color: #080C12; transparent: true; opacity: 0.88"></a-plane>
          <a-text id="recordHud" value="waiting" color="#FFFFFF" position="0 2.45 0" align="center" width="8" wrap-count="30"></a-text>
          <a-text id="recordHudDetails" color="#FFFFFF" position="0 1.65 0" align="center" width="8" wrap-count="50"></a-text>
          <a-text id="recordHudNotice" color="#FFD54F" position="0 0.85 0" align="center" width="8" wrap-count="60"></a-text>
          <a-text id="recordHudPrompt" color="#FFD54F" position="0 0.05 0" align="center" width="8" wrap-count="50"></a-text>
          <a-entity id="recordHudDirections" visible="false" position="0 -1.55 0">
            <a-text id="recordHudUp" position="0 0.85 0" align="center" width="7" wrap-count="50"></a-text>
            <a-text id="recordHudLeft" position="-2.1 0 0" align="center" width="3.9" wrap-count="26"></a-text>
            <a-text id="recordHudRight" position="2.1 0 0" align="center" width="3.9" wrap-count="26"></a-text>
            <a-text id="recordHudDown" position="0 -0.85 0" align="center" width="7" wrap-count="50"></a-text>
          </a-entity>
        </a-entity>
        <a-text id="vrLatencyHud" value="" position="0 -0.045 -0.72" scale="0.035 0.035 0.035" color="#FFFFFF" align="center" width="14" wrap-count="85"></a-text>
        <a-text id="headsetInfo" value="" position="0 -0.16 -0.72" rotation="0 0 0" scale="0.035 0.035 0.035" color="#777777" align="center"></a-text>
      </a-entity>

      <!-- Controllers: laser-controls 兼容 Quest / Pico / 其他 WebXR 手柄 -->
      <a-entity id="leftHand" laser-controls="hand: left" oculus-touch-controls="hand: left">
        <a-text id="leftHandInfo" value="Pos: ...\nRot: ..." position="0 0.04 -0.05" rotation="0 0 0" scale="0.05 0.05 0.05" color="white" align="center"></a-text>
      </a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" oculus-touch-controls="hand: right">
        <a-text id="rightHandInfo" value="Pos: ...\nRot: ..." position="0 0.04 -0.05" rotation="0 0 0" scale="0.05 0.05 0.05" color="white" align="center"></a-text>
      </a-entity>
    </a-scene>
</body></html>
