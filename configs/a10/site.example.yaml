# Copy to site.local.yaml and replace the addresses and camera placeholders.
robot:
  host: 127.0.0.1  # Address of the machine running the A10_new service.
  port: 8080
  allow_motion: false
  max_joint_step_rad: null  # Confirm the permitted joint step onsite.
  gripper_mm_range: null   # Confirm the physical range in mm onsite.
cameras:
  base_0_rgb:
    device: /dev/v4l/by-id/REPLACE_WITH_BASE_CAMERA
    rotate_180: false
  right_wrist_0_rgb:
    device: /dev/v4l/by-id/REPLACE_WITH_WRIST_CAMERA
    rotate_180: true
vr_server:
  host_ip: 127.0.0.1  # For the headset, use this FluxVLA machine's specific LAN IP.
  https_port: 8443
  websocket_port: 8442
model:
  trained_checkpoint: null  # Do not use the two-step smoke model for robot control.
  statistics_path: null
